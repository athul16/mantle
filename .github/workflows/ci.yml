# Pull request and main-branch checks (docs/11-testing.md).
# Required checks for branch protection: checks, database, e2e.
# No cloud secrets: every database test runs against a throwaway local Supabase.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typegen
        run: pnpm exec next typegen
      - name: tsc
        run: pnpm exec tsc --noEmit
      - name: lint
        run: pnpm lint
      - name: engine unit tests
        run: pnpm test:engine
      - name: component tests
        run: pnpm test:components
      - name: build
        run: pnpm build

  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: start local supabase (migrations applied)
        run: pnpm db:test:start
      - name: pgTAP (supabase test db)
        run: pnpm test:db
      - name: vitest with coverage (rls, jobs, candidate integration + unit + components)
        run: pnpm test:coverage
      - name: coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: pnpm exec tsx scripts/coverage-summary.mts >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: start local supabase (migrations applied)
        run: pnpm db:test:start
      - name: export test env for next build
        run: pnpm db:test:env --github-env
      - name: playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: build against local supabase
        run: pnpm build
      - name: playwright (chromium, firefox, webkit)
        run: pnpm test:e2e
        env:
          E2E_PREBUILT: "1"
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
